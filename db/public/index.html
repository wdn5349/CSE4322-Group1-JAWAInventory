<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JAWA Inventory</title>
  <link rel="stylesheet" href="style/login.css">
</head>
<body>

<header>
  <h1>JAWA Inventory</h1>
</header>

<div class="login-container" id="login-page">
  <form id="loginForm">
      <h2>Welcome</h2>
      
      <div class="input-group">
          <h4>Username</h4>
          <input type="text" id="username" required placeholder="Enter username">
      </div>

      <div class="input-group">
          <h4>Password</h4>
          <input type="text" id="password" required placeholder="Enter password">
      </div>

      <button type="submit" class="loginBtn" id="loginBtn">Login</button>
      <button type="button" class="registration" id="registration-btn">Create an Account</button>
      <p id="errorMessage" class="hidden">Invalid credentials. Try again.</p>
  </form>
</div>

<div id="registration-page" class="hidden">
  <form id="registerForm">
    <h2>Create Account</h2>
    <p>Join us to start managing your inventory</p>
    
    <div class="input-group">
      <h4>Username</h4>
      <input type="text" id="reg-username" required placeholder="Choose a username">
    </div>

    <div class="input-group">
      <h4>Email Address</h4>
      <input type="text" id="reg-email" required placeholder="name@company.com">
    </div>

    <div class="input-group">
      <h4>Password</h4>
        <input type="text" id="reg-password" required placeholder="Create a password">
    </div>

    <div class="input-group">
      <h4>Confirm Password</h4>
      <input type="text" id="confirm-password" required placeholder="Repeat your password">
    </div>

    <button type="submit" class="primary-btn" id="addUserBtn">Register</button>
    <p id="errorMessage-register" class="hidden">Invalid credentials. Try again.</p>
    
    <div class="form-footer">
        <p>Already have an account? <a href="index.html">Login here</a></p>
    </div>
</form>

</div>
<script>

  const loginForm = document.getElementById('loginForm');
  const registerBtn = document.getElementById('registration-btn');
  const addUserBtn = document.getElementById('addUserBtn');
  const loginPage = document.getElementById('login-page');
  const registrationPage = document.getElementById('registration-page');
  const errorMsg = document.getElementById('errorMessage');
  const errorMsgreg = document.getElementById('errorMessage-register');

  //change page: log-in -> registration
  registerBtn.addEventListener('click', () => {
    registrationPage.classList.remove('hidden');
    loginPage.classList.add('hidden');
  });

  // add user to database
  addUserBtn.addEventListener('click', async (event) => {
    event.preventDefault();

    // create userdata object 
    const userData = {
      username: document.getElementById('reg-username').value,
      email: document.getElementById('reg-email').value,
      password: document.getElementById('reg-password').value
    };

    // check if passwords match
    const confirmPass = document.getElementById('confirm-password').value;
    if (userData.password !== confirmPass) {
      errorMsgreg.classList.remove('hidden');
      return;
    }


    // add user to db
    try {
      const response = await fetch('/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(userData)
      });

      const result = await response.json();

      if (response.ok) {
        location.reload();
      } else {
        alert(result.error || "Registration failed");
      }
    } catch (err) {
      console.error("Network error:", err);
    }
  });

  // login
  loginForm.addEventListener('submit', async (event) => {
    event.preventDefault();

    const loginData = {
      username: document.getElementById('username').value,
      password: document.getElementById('password').value
    };

    try {
      const response = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(loginData)
      });

      const result = await response.json();

      if (response.ok) {
        window.location.href = "inventory.html";
      } else {
        // FAIL! Show the error message
        errorMsg.classList.remove('hidden');
        errorMsg.innerText = result.error || "Invalid Credentials";
      }
    } catch (err) {
      console.error("Login error:", err);
    }
  });

</script>
</body>
</html>
